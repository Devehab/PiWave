<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Welcome · Car Radio</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23f5a524'/%3E%3Cpath d='M6 9h12v9H6z' fill='%230f1115'/%3E%3Ccircle cx='10' cy='13.5' r='2' fill='%23f5a524'/%3E%3Cpath d='M7 8l9-4' stroke='%230f1115' stroke-width='1.6'/%3E%3C/svg%3E">
</head>
<body class="welcome">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-radio" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="14" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M14.5 12.5h3.5M14.5 15.5h3.5M6 8l11-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-bt" viewBox="0 0 24 24"><path d="M7 7.5l10 9-5 4.5V3l5 4.5-10 9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5L18 7M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2L5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>

<main>
  <div class="hero">
    <div class="hero-icon"><svg><use href="#i-radio"/></svg></div>
    <h1 data-i18n="w_hi">Hi! You're connected to the radio</h1>
    <div id="w-air" class="air off" role="status"><i></i><span id="w-air-text">…</span></div>
    <div class="now-line" id="w-now"></div>
  </div>

  <div id="w-main">
    <section class="card">
      <h2><svg><use href="#i-bt"/></svg><span data-i18n="w_bt_h">Connect your phone over Bluetooth</span></h2>
      <p class="muted small-text" data-i18n="w_bt_p"></p>
      <div id="bt-box" class="bt-box"><p class="muted">…</p></div>
    </section>

    <section class="card">
      <h2><svg><use href="#i-gear"/></svg><span data-i18n="w_panel_h">Control panel</span></h2>
      <p class="muted small-text" data-i18n="w_panel_p"></p>
      <div class="url-box"><b dir="ltr" class="url" id="w-url">http://192.168.4.1</b><button id="w-copy" class="btn small" type="button"><svg><use href="#i-copy"/></svg> <span data-i18n="w_copy">Copy</span></button></div>
      <a class="btn primary block" id="w-open" href="/" data-i18n="w_open">Open the control panel</a>
      <a class="btn ghost block" id="w-browser" href="/" target="_blank" rel="noopener" data-i18n="w_browser">Open it in the browser (Safari / Chrome)</a>
      <p class="muted small-text" data-i18n="w_browser_hint"></p>
    </section>

    <section class="card">
      <button id="w-done" class="btn primary block big" type="button" data-i18n="w_done">Done, got it ✓</button>
      <p class="muted small-text center" id="w-done-note" data-i18n="w_done_note"></p>
      <details><summary class="muted small-text" data-i18n="w_net_q">My phone's internet stopped?</summary>
        <p class="small-text" data-i18n="w_net_a"></p>
      </details>
    </section>
  </div>

  <div id="w-finished" class="card done-panel hidden">
    <div class="big-check">✓</div>
    <h2 data-i18n="w_fin_h">All set!</h2>
    <p class="muted" data-i18n="w_fin_p"></p>
    <div class="url-box"><b dir="ltr" class="url">http://192.168.4.1</b><button class="btn small" type="button" data-copy><svg><use href="#i-copy"/></svg> <span data-i18n="w_copy">Copy</span></button></div>
    <a class="btn ghost block" href="/" data-i18n="w_open">Open the control panel</a>
  </div>
</main>

<div id="toast" class="toast hidden" role="alert"></div>
<script src="/static/i18n.js"></script>
<script src="/static/bt.js"></script>
<script src="/static/welcome.js"></script>
</body>
</html>
