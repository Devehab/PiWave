# ===================== PiRadio settings =====================
# You can edit this file on your computer before installing.
# Keep the format: NAME="value"  (everything can be changed later from the web page)

# The Wi-Fi network the Raspberry Pi creates (in the car)
WIFI_NAME="PiRadio"
# Wi-Fi password: at least 8 English letters/numbers
WIFI_PASSWORD="piradio123"
# Wi-Fi country code (JO = Jordan, PS = Palestine, SA, AE, EG, US ...)
WIFI_COUNTRY="JO"

# First FM frequency in MHz (87.5 - 108.0). Pick an empty one on your car radio.
FREQUENCY="107.9"
# Station name shown on the car display: max 8 English letters/numbers
STATION_NAME="PI RADIO"

# "yes" = when your phone joins the Wi-Fi, the radio page opens by itself
CAPTIVE_PORTAL="yes"
